version: "3.9"

# FedLoRA-MAML — Phase 2 federated stack (VCTK, 12 nodes)
#
# One server + 12 node containers sharing the host GPU.
# Each round the server samples fraction_fit=0.5 → 6 nodes.
# Nodes not selected in a given round are idle (connected but waiting).
#
# Prerequisites:
#   1. Build images:
#        docker compose -f docker/docker-compose.vctk.yml build
#   2. VCTK nodes prepared:
#        python data/prepare_vctk_lora.py
#   3. Set HF_CACHE to your HuggingFace cache dir:
#        export HF_CACHE=/teamspace/studios/this_studio/.cache/huggingface
#
# Run:
#   docker compose -f docker/docker-compose.vctk.yml up
#
# Monitor:
#   docker compose -f docker/docker-compose.vctk.yml logs -f server

networks:
  voicefl-net:
    driver: bridge

x-node-base: &node-base
  image: voicefl-lora-node
  build:
    context: ..
    dockerfile: docker/Dockerfile.node
  networks:
    - voicefl-net
  depends_on:
    server:
      condition: service_started
  environment:
    - PYTHONUNBUFFERED=1
    - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    # Offline mode: model already cached, prevents 12 containers hitting HF simultaneously
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
  volumes:
    # Read-write so HuggingFace can create .locks/ for concurrent model loading
    - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
  command: >
    python federated/run_node_lora.py
      --config configs/vctk_lora_poc.yaml
      --server_address server:8080
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  restart: "no"

services:
  server:
    image: voicefl-lora-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    networks:
      - voicefl-net
    ports:
      - "8080:8080"
    volumes:
      - ../checkpoints/federated:/app/checkpoints/federated
      - ../checkpoints/centralized:/app/checkpoints/centralized:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command: >
      python federated/server_lora.py
        --config configs/vctk_lora_poc.yaml
    restart: "no"

  # ── meta-train nodes (12) ────────────────────────────────────────────────
  node_p225:
    <<: *node-base
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - SPEAKER_ID=p225
    volumes:
      - ../data/vctk_nodes/p225:/data:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface

