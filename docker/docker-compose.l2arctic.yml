      SPEAKER_ID: HJK
    volumes:
      - ../data/l2arctic_nodes/HJK:/data:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface

  # ── Spanish nodes (L1: es) ───────────────────────────────────────────────
