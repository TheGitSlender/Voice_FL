    <<: *node-base
    environment:
      <<: *node-env
      SPEAKER_ID: ERMS
    volumes:
      - ../data/l2arctic_nodes/ERMS:/data:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface

  node_EBVS:
    <<: *node-base
    environment:
      <<: *node-env
      SPEAKER_ID: EBVS
    volumes:
      - ../data/l2arctic_nodes/EBVS:/data:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface

  # ── Arabic nodes (L1: ar) ────────────────────────────────────────────────
