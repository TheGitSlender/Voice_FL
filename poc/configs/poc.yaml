device: cuda

data:
  meta_split: data/meta_split.json
  nodes_dir: data/nodes
  test_nodes_dir: data/test_nodes

maml:
  inner_steps: 3
  inner_lr: 0.0001
  outer_lr: 0.0002
  support_size: 8
  query_size: 8
  mode: fomaml
  max_grad_norm: 10.0

federated:
  rounds: 20
  fraction_fit: 1.0
  min_available_clients: 12
  port: 8080

node:
  server_address: "server:8080"
  device: cuda
  nodes_dir: /data

evaluation:
  eval_clips: 20
  support_size: 8
  eval_k: 10
  eval_inner_lr: 0.0001
  bootstrap_n: 1000
  federation_tolerance: 0.15

checkpoint_dir: checkpoints/federated
