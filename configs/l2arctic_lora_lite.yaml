# Memory-reduced L2-ARCTIC config for single-GPU multi-node setups.
# Key change: tasks_per_node 3 → 1 cuts peak VRAM from ~78 GB to ~26 GB.
# This means each node sends 1 meta-gradient per round instead of 3.
# Training quality is similar — the server still aggregates across all nodes.

model:
  name: facebook/wav2vec2-base-100h
  mode: lora_maml
  lora_rank: 8
  lora_alpha: 16
  lora_layers: [6, 7, 8, 9, 10, 11]
  lora_targets: [q_proj, k_proj, v_proj, out_proj]

maml:
  mode: lora_maml
  rounds: 200
  k: 5
  inner_lr: 5.0e-3
  outer_lr: 5.0e-4
  outer_optimizer: adamw
  outer_weight_decay: 1.0e-4
  lr_schedule: cosine
  lr_warmup_rounds: 20
  tasks_per_node: 1          # 3 → 1: biggest VRAM saver (~3x less)
  support_size: 15
  query_size: 20
  eval_support_size: 20
  eval_query_size: 50
  max_audio_samples: 48000   # 64000 → 48000 (3s instead of 4s, saves ~25% activations)
  lora_rank: 8
  lora_alpha: 16.0
  max_grad_norm: 50.0

federated:
  num_nodes: 12
  cohort_fraction: 0.25  # 3/12 nodes per round; ~26 GB peak per node with these settings
  num_rounds: 200

data:
  dataset: l2arctic
  nodes_dir: data/l2arctic_nodes
  test_nodes_dir: data/l2arctic_test_nodes
  split_file: data/l2arctic_split.json

hardware:
  device: cuda

logging:
  experiment_name: fedlora_maml_l2arctic

aggregation:
  robust_method: mean
  trim_ratio: 0.10
  n_byzantine: 1
  norm_filter_multiplier: 2.0
  secure_agg: false
  secagg_mask_scale: 0.01
