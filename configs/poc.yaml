device: cuda

data:
  meta_split: data/meta_split.json
  nodes_dir: data/nodes
  test_nodes_dir: data/test_nodes

maml:
  inner_steps: 3
  inner_lr: 0.0001
  outer_lr: 0.0002
  support_size: 8
  query_size: 8
  mode: fomaml
  max_grad_norm: 10.0

federated:
  rounds: 20
  fraction_fit: 1.0
  min_available_clients: 12
  port: 8080

node:
  server_address: "server:8080"
  device: cuda
  nodes_dir: /data

evaluation:
  eval_clips: 20
  support_size: 8
  eval_k: 10
  eval_inner_lr: 0.0001
  bootstrap_n: 1000
  federation_tolerance: 0.15

checkpoint_dir: checkpoints/federated

aggregation:
  robust_method: mean          # mean | trimmed_mean | coordinate_median | krum | norm_filter
  trim_ratio: 0.10             # For trimmed_mean: fraction dropped from each tail (N > 2f)
  n_byzantine: 1               # For krum: assumed max Byzantine clients (N >= 2f+2)
  norm_filter_multiplier: 2.0  # For norm_filter: drop if norm > median_norm * this
  secure_agg: false            # Pairwise-mask SecAgg (see federated/secure_agg.py)
  secagg_mask_scale: 0.01      # Std of additive mask noise
