model:
  name: facebook/wav2vec2-base-960h
  mode: lora_maml
  lora_rank: 8
  lora_alpha: 16
  lora_layers: [6, 7, 8, 9, 10, 11]
  lora_targets: [q_proj, k_proj, v_proj, out_proj]

maml:
  mode: lora_maml
  k: 5
  inner_lr: 5.0e-4
  outer_lr: 2.0e-4
  support_size: 20
  query_size: 20
  lora_rank: 8
  lora_alpha: 16.0

federated:
  num_nodes: 12
  cohort_fraction: 0.5
  num_rounds: 30

data:
  dataset: l2arctic
  split_file: data/l2arctic_split.json
  eval_clips_file: data/l2arctic_eval_clips.json

hardware:
  device: cuda
  use_bf16: true

logging:
  experiment_name: fedlora_maml_l2arctic
